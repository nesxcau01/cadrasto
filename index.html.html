<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Cadastro</h1>
    <p class="subtitulo">Preencha os dados abaixo e clique em enviar.</p>

    <!-- Mensagem de confirmação: começa escondida (atributo hidden)
         e é exibida pelo JavaScript quando o formulário é enviado -->
    <div id="mensagem" class="mensagem" role="alert" hidden>
      <strong>Formulário enviado com sucesso!</strong>
      <span id="mensagem-detalhe"></span>
    </div>

    <!-- O formulário é um GRID (definido no CSS) -->
    <form id="formulario" class="grid-form" novalidate>

      <div class="campo campo-largo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
      </div>

      <div class="campo campo-largo">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade" required>
      </div>

      <div class="campo">
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" placeholder="xx.xxx-xxx" maxlength="10" inputmode="numeric" required>
      </div>

      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="xxx.xxx.xxx-xx" maxlength="14" inputmode="numeric" required>
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" placeholder="+55 (xx) x xxxx-xxxx" maxlength="19" inputmode="tel" required>
      </div>

      <div class="campo">
        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" name="cnpj" placeholder="XX.XXX.XXX/XXXX-XX" maxlength="18" inputmode="numeric" required>
      </div>

      <div class="campo campo-largo">
        <button type="submit">Enviar</button>
      </div>

    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
